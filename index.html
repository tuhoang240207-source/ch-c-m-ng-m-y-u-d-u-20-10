<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 Mẹ Yêu Dấu 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Hiệu ứng cánh hoa rơi */
        .petal {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 150% 0 150% 0;
            animation: animatePetal 10s linear infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes animatePetal {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                top: 110%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* Thẻ Container chính */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.15);
            text-align: center;
            max-width: 550px;
            width: 100%;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 2px solid #ffffff;
            animation: fadeIn 1.2s ease-in-out;
        }

        .heart-icon {
            font-size: 55px;
            color: #e91e63;
            margin-bottom: 10px;
            display: inline-block;
            animation: beat 1.1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.18); }
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-weight: 600;
            color: #8e24aa;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .btn-open {
            background: linear-gradient(45deg, #ec407a, #ab47bc);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.35);
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.5);
        }

        /* Khung nội dung lời chúc */
        .letter-content {
            display: none;
            margin-top: 25px;
            text-align: left;
            line-height: 1.8;
            color: #37474f;
            background: #fff5f8;
            padding: 22px;
            border-radius: 16px;
            border-left: 5px solid #ec407a;
            animation: slideDown 0.8s ease-out forwards;
        }

        .typing-text {
            font-size: 15px;
            white-space: pre-wrap;
        }

        .footer-text {
            text-align: right;
            font-weight: bold;
            color: #d81b60;
            margin-top: 15px;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
